replicaCount: 2

image:
  repository: <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/demo-app
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  name: demo-app
  # Paste the Terraform output "app_irsa_role_arn" here
  roleArn: ""

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: true
